[project]
name = "antigravity-seo"
version = "2.6.2"
description = "Comprehensive SEO analysis skill for Antigravity"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Antigravity Linh"}
]
keywords = ["seo", "antigravity-code", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/Antigravity/antigravity-seo"
Repository = "https://github.com/Antigravity/antigravity-seo"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
